<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <!-- Bootstrap CSS for a professional desktop look -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-y: hidden; /* Prevent scrolling if it fits */
        }
        .main-container {
            max-width: 1200px; /* Wider to accommodate more horizontal items */
            margin-top: 20px;
        }
        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            background-color: #ffffff;
            border-bottom: 1px solid #f1f3f5;
            padding: 15px;
            border-radius: 8px 8px 0 0 !important;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
            font-size: 0.8rem;
            margin-bottom: 2px;
        }
        .form-control {
            border-radius: 6px;
            border: 1px solid #ced4da;
            padding: 6px 10px;
            font-size: 0.9rem;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
            border-color: #86b7fe;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            border-radius: 6px;
            padding: 8px 20px;
            font-weight: 600;
        }
        .result-box {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-left: 6px solid #4caf50;
            padding: 10px;
            border-radius: 6px;
            font-weight: 500;
        }
        .g-3, .gx-3 {
            --bs-gutter-x: 1rem;
            --bs-gutter-y: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container main-container">
        
        <div class="card mb-3">
            <div class="card-header text-center">
                <h3 class="fw-bold text-dark mb-0">Vehicle Insurance Prediction</h3>
            </div>
            
            <div class="card-body p-3">
                {% if context and context != 'Rendering' %}
                    <div class="result-box mb-3 shadow-sm text-center">
                        <h5 class="mb-0">{{ context }}</h5>
                    </div>
                {% endif %}

                <form method="post" action="/">
                    <div class="row g-3 align-items-end">
                        
                        <div class="col-md-3">
                            <label for="Gender" class="form-label">Gender (1: Male, 0: Female)</label>
                            <input type="number" class="form-control" id="Gender" name="Gender" min="0" max="1" required>
                        </div>
                        <div class="col-md-3">
                            <label for="Age" class="form-label">Age (e.g., 35)</label>
                            <input type="number" class="form-control" id="Age" name="Age" required>
                        </div>
                        <div class="col-md-3">
                            <label for="Driving_License" class="form-label">Driving License (1: Yes, 0: No)</label>
                            <input type="number" class="form-control" id="Driving_License" name="Driving_License" min="0" max="1" required>
                        </div>
                        <div class="col-md-3">
                            <label for="Region_Code" class="form-label">Region Code (e.g., 28.0)</label>
                            <input type="number" step="0.01" class="form-control" id="Region_Code" name="Region_Code" required>
                        </div>

                        <div class="col-md-3">
                            <label for="Policy_Sales_Channel" class="form-label">Sales Channel (e.g., 124)</label>
                            <input type="number" step="0.01" class="form-control" id="Policy_Sales_Channel" name="Policy_Sales_Channel" required>
                        </div>
                        <div class="col-md-3">
                            <label for="Vintage" class="form-label">Vintage (Days) (e.g., 150)</label>
                            <input type="number" class="form-control" id="Vintage" name="Vintage" required>
                        </div>
                        <div class="col-md-3">
                            <label for="Annual_Premium" class="form-label">Annual Premium (Rs) (e.g., 25000)</label>
                            <input type="number" step="0.01" class="form-control" id="Annual_Premium" name="Annual_Premium" required>
                        </div>
                        <div class="col-md-3">
                            <label for="Previously_Insured" class="form-label">Previously Insured (1: Yes, 0: No)</label>
                            <input type="number" class="form-control" id="Previously_Insured" name="Previously_Insured" min="0" max="1" required>
                        </div>

                        <div class="col-md-3">
                            <label for="Vehicle_Age_lt_1_Year" class="form-label">Veh. Age &lt; 1 Yr (1: Yes, 0: No)</label>
                            <input type="number" class="form-control" id="Vehicle_Age_lt_1_Year" name="Vehicle_Age_lt_1_Year" min="0" max="1" required>
                        </div>
                        <div class="col-md-3">
                            <label for="Vehicle_Age_gt_2_Years" class="form-label">Veh. Age &gt; 2 Yrs (1: Yes, 0: No)</label>
                            <input type="number" class="form-control" id="Vehicle_Age_gt_2_Years" name="Vehicle_Age_gt_2_Years" min="0" max="1" required>
                        </div>
                        <div class="col-md-3">
                            <label for="Vehicle_Damage_Yes" class="form-label">Veh. Damaged (1: Yes, 0: No)</label>
                            <input type="number" class="form-control" id="Vehicle_Damage_Yes" name="Vehicle_Damage_Yes" min="0" max="1" required>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100 shadow-sm">Predict Interest</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center">
            <form method="get" action="/train" class="d-inline">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Retrain Model</button>
            </form>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
